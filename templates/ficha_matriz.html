<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  /* 1. TIPOGRAFÍA SCANDIA */
  @font-face {
    font-family: 'Scandia';
    src: url('/fonts/Scandia-Regular.woff2') format('woff2');
    font-weight: normal;
    font-style: normal;
  }
  @font-face {
    font-family: 'Scandia';
    src: url('/fonts/Scandia-Bold.woff2') format('woff2');
    font-weight: bold;
    font-style: normal;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body { 
    background: #fff; 
    font-family: 'Scandia', sans-serif; 
  }

  .hoja {
    position: relative;
    display: flex;
    flex-direction: column;
    background: #fff;
    overflow: hidden;

    /* LÓGICA DE DIMENSIONES IDENTICA A FICHA NORMAL */
    /* Usamos datos_matriz|length para contar encabezado + filas */
    {% if datos_matriz|length <= 7 %}
      width: 1280px; 
      height: 1103px; 
    {% else %}
      width: 1225px; 
      height: 1475px; 
    {% endif %}
  }

  .header img { width: 100%; display: block; }

  /* POSICIONAMIENTO IGUAL A FICHA NORMAL */
  .contenido { 
    flex: 1; 
    padding: 0 40px; 
    position: relative; /* Permite que logo y foto se posicionen relativo a esto */
  }

  .logo { 
    position: absolute; 
    top: 15px; 
    left: 40px; 
    width: 250px; 
    height: 80px; 
    display: flex;
    align-items: center;
    z-index: 10;
  }
  .logo img { max-width: 100%; max-height: 100%; object-fit: contain; }

  .foto { 
    position: absolute; 
    top: 10px; 
    right: 40px; 
    width: 175px; 
    height: 175px; 
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .foto img { max-width: 100%; max-height: 100%; object-fit: contain; }

  /* TÍTULO - Ajustado a los 124px de la ficha normal */
  .info-superior { 
    margin-top: 124px; 
    width: 84%; /* Mismo ancho que la ficha normal */
    margin-bottom: 20px; 
  }
  
  .product-title { 
    font-size: 30px; 
    font-weight: bold; 
    text-transform: uppercase; 
    color: #000;
    line-height: 1.2;
  }
  
  .sku-list { 
    font-size: 18px; 
    color: #555; 
    margin-top: 5px; 
    font-weight: normal;
  }

  /* TABLA MATRIZ */
  .tabla-matriz {
    width: 100%;
    border-collapse: collapse;
    margin-top: 40px; /* Igual que el margen de la tabla normal */
    font-size: 18px;
  }

  .tabla-matriz th {
    background-color: #e0e0e0;
    padding: 12px 8px;
    font-weight: bold;
    border: 1px solid #ccc;
    text-align: center;
    text-transform: uppercase;
    color: #333;
  }

  .tabla-matriz td {
    padding: 10px 8px;
    border: 1px solid #eee;
    text-align: center;
    vertical-align: middle;
    color: #444;
  }

  .tabla-matriz tbody tr:nth-child(even) { background-color: #f9f9f9; }

  .footer { margin-top: auto; line-height: 0; }
  .footer img { width: 100%; display: block; }

</style>
</head>
<body>
<div class="hoja">
  <div class="header"><img src="{{ header_img }}"></div>

  <div class="contenido">
    <div class="logo">
      {% if logo_marca %}
      <img src="{{ logo_marca }}">
      {% endif %}
    </div>

    <div class="foto">
      {% if foto_producto %}
      <img src="{{ foto_producto }}">
      {% endif %}
    </div>

    <div class="info-superior">
      <h1 class="product-title">{{ nombre }}</h1>
      <p class="sku-list">SKU: {{ skus_concatenados }}</p>
    </div>

    <table class="tabla-matriz">
      <thead>
        <tr>
          {% for h in datos_matriz[0] %}
            <th>{{ h }}</th>
          {% endfor %}
        </tr>
      </thead>
      <tbody>
        {% for fila in datos_matriz[1:] %}
        <tr>
          {% for celda in fila %}
            <td>{{ celda }}</td>
          {% endfor %}
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <div class="footer"><img src="{{ footer_img }}"></div>
</div>
</body>
</html>
